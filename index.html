<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dig In: Interactive Reading</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--orange:#C1440E;--bg:#F6F7FA;--card:#fff;--ink:#1A1A1A;--muted:#5B6577;--line:#D9DEE8;--ok:#1F7A4D;--okbg:#E7F5EE;--bad:#B3261E;--badbg:#FCEBEA;--peach:#FBE3D6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',Calibri,Arial,sans-serif;line-height:1.6;font-size:17px}
header{background:var(--navy);color:#fff;padding:22px 16px}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
h1{font-family:'Space Grotesk',sans-serif;margin:0;font-size:26px;line-height:1.2}
header p{margin:4px 0 0;color:#C9D3E3;font-size:15px}
.progress{display:flex;gap:6px;margin:18px 0 6px;flex-wrap:wrap}
.dot{flex:1 1 0;min-width:28px;height:8px;border-radius:4px;background:var(--line)}
.dot.done{background:var(--ok)}
.dot.cur{background:var(--orange)}
.plabel{font-size:14px;color:var(--muted);margin-bottom:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;margin-bottom:18px}
.chip{display:inline-block;background:var(--orange);color:#fff;font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:5px;margin-bottom:8px}
h2{font-family:'Space Grotesk',sans-serif;font-size:27px;line-height:1.2;margin:0 0 14px;color:var(--navy)}
h3{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:22px 0 6px;color:var(--navy)}
p{margin:0 0 14px}
ul,ol{margin:0 0 14px;padding-left:22px}
li{margin-bottom:6px}
ol li::marker{font-weight:700;color:var(--navy)}
ol.roadmap li{margin-bottom:16px}
ol.roadmap li>ul{margin-top:10px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 18px}
.compare div{border-radius:10px;padding:12px 14px;font-size:16px}
.thin{background:#EEF1F6}
.det{background:var(--peach)}
.compare b{display:block;font:700 11px 'Space Grotesk',sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.thin b{color:var(--muted)}.det b{color:var(--orange)}
.example{border:2px solid var(--navy);border-radius:12px;padding:14px 16px 6px;margin:18px 0;background:#fff}
.example .tag{display:inline-block;background:var(--navy);color:#fff;font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:5px;margin-bottom:8px}
.example .why{background:#EEF1F6;border-radius:8px;padding:8px 12px;font-size:15px;margin:0 0 12px}
.goes{background:#EEF1F6;border-radius:10px;padding:12px 14px;font-size:15px;margin:16px 0 0}
.goes b{color:var(--navy)}
.callout{background:var(--navy);color:#fff;border-radius:12px;padding:16px 18px;margin:14px 0}
.callout.big{background:var(--orange);font-family:'Space Grotesk',sans-serif;font-size:24px;line-height:1.25;text-align:center;padding:22px 18px}
.def{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:15px;background:#FCFCFD}
.def b{color:var(--navy)}
.def i{color:var(--muted)}
.check{margin-top:26px;border-top:2px solid var(--line);padding-top:6px}
.q{margin:18px 0}
.q .qt{font-weight:600;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;font:16px 'IBM Plex Sans',sans-serif;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:600}
.opt:disabled{cursor:default}
.fb{font-size:15px;border-radius:8px;padding:9px 12px;margin-top:4px}
.fb.ok{background:var(--okbg);color:#14502F}
.fb.no{background:var(--badbg);color:#7A1913}
.write{background:#FFF8F3;border:1.5px solid #F2C9B5;border-radius:12px;padding:14px 16px;margin-top:22px}
.write h3{margin:0 0 4px;color:var(--orange)}
.write textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:9px;padding:11px;font:16px 'IBM Plex Sans',sans-serif;resize:vertical;background:#fff}
.write textarea:focus{outline:2px solid var(--orange);border-color:var(--orange)}
.wc{font-size:14px;color:var(--muted);margin-top:4px}
.wc.ok{color:var(--ok);font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 40px;flex-wrap:wrap}
.btn{background:var(--orange);color:#fff;border:0;border-radius:9px;padding:12px 22px;font:600 16px 'IBM Plex Sans',sans-serif;cursor:pointer}
.btn:disabled{background:#B9C0CC;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.lockmsg{font-size:14px;color:var(--muted);flex:1;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
input[type=text]{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:9px;font:17px 'IBM Plex Sans',sans-serif}
input[type=text]:focus{outline:2px solid var(--orange);border-color:var(--orange)}
label.l{font-weight:600;display:block;margin-bottom:6px}
.sumrow{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;gap:16px;font-size:16px}
.sumrow span:last-child{color:var(--ok);font-weight:600;flex-shrink:0}
.hidden{display:none}
#printView{display:none}
@media(max-width:600px){.compare{grid-template-columns:1fr}.panel{padding:18px 16px}h2{font-size:23px}}
@media print{
 body{background:#fff;font-size:11pt}
 header,#app,.progress,.plabel{display:none!important}
 #printView{display:block!important}
 #printView h1{font-size:20pt;color:#0B1F3A;margin:0 0 4px}
 .pv-meta{font-size:11pt;margin-bottom:12px}
 .pv-sec{margin-bottom:12px;border:1px solid #999;padding:8px 10px}
 .pv-sec h4{margin:0 0 4px;font-size:12pt}
 .pv-q{font-size:10.5pt;margin:4px 0;break-inside:avoid}
 .pv-q i{color:#333}
 .pv-w{break-after:avoid;page-break-after:avoid}
 .pv-sec h4{break-after:avoid;page-break-after:avoid}
 .pv-r{font-size:10.5pt;margin:8px 0 4px;padding:6px 8px;border:1px solid #bbb;white-space:pre-wrap;break-inside:avoid}
 .pv-attest{margin-top:14px;font-size:11pt;border-top:2px solid #000;padding-top:8px}
}
</style>
</head>

<header><div class="wrap"><h1>Dig In</h1><p>TGE 1150 · Module 4 · Week 3 · Interactive Reading</p></div></header>
<div class="wrap" id="app">
  <div class="progress" id="progress"></div>
  <div class="plabel" id="plabel"></div>
  <div id="stage"></div>
</div>
<div class="wrap" id="printView"></div>

<script>
var SECTIONS = [
{id:'start',title:'Start Here',kind:'start'},
{"id": "big", "chip": "Section A: The Big Idea", "title": "Digging in turns saved links into evidence", "body": "<p>In Week 2 you found and saved your sources. This week you open every one of them and find out what they actually say.</p>\n<p>Picture Dani back in front of Ray, the shop owner. Dani says, \"A trade association says shops should plan for busy seasons.\" Ray says, \"What did it say, exactly? Who wrote it? How do you know it is still true?\"</p>\n<p>That is the whole week. A <b>saved link</b> only tells Ray that a page exists. <b>Evidence</b> is what you can say about that page, with confidence, when someone challenges you. If you did not dig into a source, you cannot speak to it in your meeting with your instructor.</p>\n<h3>The jobs this week</h3>\n<ol>\n<li><b>Bring in your Week 2 research.</b> Copy your ask, problem, framework, and sources from your Week 2 Word doc.</li>\n<li><b>Dig into each source.</b> Say what it says in your own words, pull out the key facts, and ask who wrote it and what they gain. In Round Two, compare your two options side by side.</li>\n<li><b>Fact-check it.</b> List your key claims and show where in your sources each one comes from.</li>\n<li><b>Build a verified package.</b> An AI writes four sections of your proposal from your package and nothing else. It also builds a speaking guide you can use to prepare for your meeting with your instructor.</li>\n</ol>\n<p>In Round Two you saved two options for the same kind of equipment. This week you compare them side by side. You give your supervisor both options, and then you say which one is best and why.</p>\n<h3>Two rules for this week</h3>\n<ul>\n<li><b>If it is not in your package, it is not in your proposal.</b> The AI can only use what you give it.</li>\n<li><b>You are responsible for every claim.</b> Every claim in your package has to trace back to a source you dug into.</li>\n</ul>\n<p>Dani keeps going through every section as the example. Dani is made up. The sources Dani uses are real. Your own work will use your own field and your own facts.</p>\n<p>This reading explains what each step on the Research Proposal Worksheet asks and what a strong answer looks like. You do the real work on the worksheet.</p>", "goes": "Everything you do this week builds the package the AI uses to write your proposal.", "qs": [{"q": "Dani says, \"A trade association says shops should plan for busy seasons.\" Ray asks, \"What did it say, exactly?\" What does Dani need?", "o": ["A longer explanation of why Dani believes the shop needs a machine", "To have opened the source and be able to say what it says in Dani's own words", "A louder way of saying the same claim so that Ray takes it seriously", "A second person in the shop who is willing to repeat the claim to Ray"], "c": 1, "hint": "Think about the difference between a saved link and evidence.", "why": "A saved link only shows a page exists. Evidence is what you can say about it when challenged."}, {"q": "What is the first job this week?", "o": ["Bring in your Week 2 research from your Week 2 Word doc", "Paste the AI's draft into the worksheet and check it", "Write the four sections of the proposal yourself", "Find three new sources to replace the ones from Week 2"], "c": 0, "hint": "See the list under \"The jobs this week.\"", "why": "You start by bringing your ask, problem, framework, and sources over from Week 2."}, {"q": "What can the AI use when it writes your four sections?", "o": ["Anything it knows about your industry, since it has read a lot", "Your instructor's notes from your meeting", "Any source it can find on its own that fits your topic", "Only what is in your verified package"], "c": 3, "hint": "Read the first rule for this week.", "why": "If it is not in your package, it is not in your proposal."}], "write": {"prompt": "Write your Week 2 ask in one sentence. Then name the source you are most worried about explaining to a supervisor, and why.", "min": 0, "use": "Read First, What This Worksheet Is For"}},
{"id": "s1", "chip": "Section B: Step 1", "title": "Bring in your Week 2 research", "body": "<p>Step 1 on the Research Proposal Worksheet is where you bring your Week 2 research over. You copy it from your Week 2 Word doc and paste it into the matching boxes. You do not retype it and you do not change it yet.</p>\n<p>Why copy and paste? Because every step this week builds on these exact words and links. One wrong letter in a link and the whole source is lost.</p>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani, Step 1</span>\n<p>Dani opens the Week 2 Word doc and copies the ask: I am asking you to approve buying a second lift, around $5,300, so the shop is never down to one lift. Dani pastes it into the first box.</p>\n<p>Then Dani copies each source over, one at a time, and clicks every link right away. Here is the list Dani pastes in:</p>\n<ul>\n<li><b>Framework:</b> \"Theory of Constraints,\" Vorne Industries. Link: <a href=\"https://leanproduction.com/theory-of-constraints\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://leanproduction.com/theory-of-constraints</a></li>\n<li><b>Round One, Source 1:</b> \"Tire Shop Spring Preparation: Gear Up for the Busy Season,\" Matt White, Tire Industry Association, on Autosphere. Link: <a href=\"https://autosphere.ca/tires/2026/05/06/tire-shop-spring-preparation-gear-up-for-the-busy-season/\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://autosphere.ca/tires/2026/05/06/tire-shop-spring-preparation-gear-up-for-the-busy-season/</a></li>\n<li><b>Round One, Source 2:</b> \"Preparing and Planning for Winter,\" Diane Freeman, Automotive Aftermarket Retailers of Ontario, on Autosphere. Link: <a href=\"https://autosphere.ca/mechanical/2021/09/16/preparing-and-planning-for-winter/\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://autosphere.ca/mechanical/2021/09/16/preparing-and-planning-for-winter/</a></li>\n<li><b>Round Two, Option 1:</b> BendPak XPR-10AS spec sheet. Link: <a href=\"https://global-uploads.webflow.com/5e94d8ed625f9c1df681e6ec/60b907cc14294c56465b6384_XPR-10AS-Two-Post-Lift-5175397-BendPak.pdf\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://global-uploads.webflow.com/5e94d8ed625f9c1df681e6ec/60b907cc14294c56465b6384_XPR-10AS-Two-Post-Lift-5175397-BendPak.pdf</a></li>\n<li><b>Round Two, Option 2:</b> Rotary SPOA10 cutsheet. Link: <a href=\"https://vsgdover.bynder.com/m/14315639ec053969/original/SPOA-AV_CUTSHEET_2023-10-pdf.pdf\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://vsgdover.bynder.com/m/14315639ec053969/original/SPOA-AV_CUTSHEET_2023-10-pdf.pdf</a></li>\n<li><b>Round Three, Source 1:</b> \"BendPak Ranger lift review: BendPak XPR-10S,\" Tyler Fussner, Fleet Maintenance. Link: <a href=\"https://www.fleetmaintenance.com/in-the-bay/tools/article/21088669/bendpak-ranger-lift-review-bendpak-xpr-10s\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://www.fleetmaintenance.com/in-the-bay/tools/article/21088669/bendpak-ranger-lift-review-bendpak-xpr-10s</a></li>\n<li><b>Round Three, Source 2:</b> Garage Journal thread, \"Two-post Lifts: Rotary vs. Bendpak\" (a Rotary owner's reply). Link: <a href=\"https://www.garagejournal.com/forum/threads/two-post-lifts-rotary-vs-bendpak.387965/\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://www.garagejournal.com/forum/threads/two-post-lifts-rotary-vs-bendpak.387965/</a></li>\n</ul>\n<p>Each link opens the right page. Good.</p>\n<p>One link from Round Two opens a page that says \"not found.\" Dani goes back to Week 2 and finds the page again before moving on.</p>\n<div class=\"why\">Why it works: Dani checks each link the moment it is pasted, so a broken link is caught now and not in the middle of the presentation.</div></div>\n<h3>What you bring in</h3>\n<ul>\n<li>Your one-sentence ask and your problem, with the incident that proves it.</li>\n<li>Your framework: the name, its source (the title, the link, where you found it, and what kind of source it is), why it fits, another way to read your facts, and what would prove it does not apply.</li>\n<li>Every source from Round One, Round Two, and Round Three, with the title, link, where you found it, and what kind of source it is.</li>\n</ul>\n<h3>Doing this well</h3>\n<ul>\n<li>Keep your Week 2 Word doc open and copy from it. Paste exactly what you saved.</li>\n<li>Paste the whole link, from https to the very end. Then click it to make sure it opens the right page.</li>\n<li>If you added more than two sources in a round, bring in every one of them. Use the button to add a block for each extra source.</li>\n<li>If something is missing, go back to your Week 2 worksheet and finish it. You need at least seven sources before you move on.</li>\n</ul>", "goes": "Everything else this week starts from what you bring in here. The worksheet builds a card for each source you paste.", "qs": [{"q": "Why do you copy and paste from your Week 2 Word doc and not retype?", "o": ["The worksheet will not accept typed answers in these boxes", "It lets you change your sources before you begin", "One wrong letter in a link can lose the whole source", "Your instructor checks that the text matches the PDF word for word"], "c": 2, "hint": "Read the paragraph that starts \"Why copy and paste?\"", "why": "Every step builds on these exact words and links."}, {"q": "Dani pastes a link and it opens a page that says \"not found.\" What should Dani do?", "o": ["Leave it in and hope no one clicks it during the presentation", "Go back to Week 2 and find the page again before moving on", "Delete the source and use one fewer source", "Ask the AI to rewrite the link so that it works"], "c": 1, "hint": "Look at the \"Watch it work\" box.", "why": "Catch a broken link now, not in the middle of the presentation."}, {"q": "You added three sources in Round Two on the Week 2 worksheet. What do you do in Step 1 this week?", "o": ["Bring in all three, using the button to add a block", "Bring in only the first two, because two is the minimum", "Bring in the best two and ignore the third one", "Skip Round Two, because it is the numbers round"], "c": 0, "hint": "See \"Doing this well.\"", "why": "Bring in every source you saved."}]},
{"id": "q1", "chip": "Quick Concept", "title": "Why dig in before you give anything to the AI?", "body": "<p>The AI can be only as accurate as the package you give it. If the package is thin, the proposal is thin. If the package has an error, the proposal repeats the error with confidence.</p>\n<h3>Why you dig in first</h3>\n<ul>\n<li><b>You have to defend every line.</b> In your meeting with your instructor, you can be asked about any sentence. If you did not read the source, you cannot answer.</li>\n<li><b>It catches weak sources early.</b> A source that does not say what you hoped is useful to learn now. You can replace it before it is in your proposal.</li>\n<li><b>It keeps the AI honest.</b> The AI writes only from your package. If a fact is not in there, it should not be in your proposal.</li>\n<li><b>It makes the writing yours.</b> The package is your understanding of the evidence, in your own words.</li>\n</ul>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani</span>\n<p><b>Without digging in:</b> Dani hands the AI a list of links. The AI writes, \"Studies show shops lose customers during busy seasons.\" Dani cannot find that claim in any source.</p>\n<p><b>With digging in:</b> Dani hands the AI notes in Dani's own words from each source. The proposal only says what Dani's notes say, and Dani can point to the source for each line.</p>\n<div class=\"why\">Why it works: the second package gives the AI facts to use and gives Ray something to check.</div></div>", "goes": "This is why the first half of the worksheet is digging in and checking. The AI writes after, not before.", "qs": [{"q": "Why does the AI's proposal depend on your package?", "o": ["The AI checks your package for spelling mistakes only", "The AI refuses to write without seven sources", "The AI copies your package into the proposal word for word", "The AI can only be as accurate as the package you give it"], "c": 3, "hint": "Read the first paragraph.", "why": "A thin package makes a thin proposal, and an error in the package shows up in the proposal."}, {"q": "Why do you dig in before the AI writes anything?", "o": ["So you can skip the fact-check later", "So the AI has less work to do", "So you can defend every line when your supervisor asks about it", "So your instructor does not need to read the proposal"], "c": 2, "hint": "See \"You have to defend every line.\"", "why": "If you did not read the source, you cannot answer questions about it."}, {"q": "The AI writes, \"Studies show shops lose customers during busy seasons.\" Dani cannot find that in any source. What went wrong?", "o": ["The AI is not able to read sources at all", "Dani gave the AI a list of links and no notes from digging in", "Dani gave the AI too many sources", "The proposal needed a longer introduction"], "c": 1, "hint": "Compare the two versions in the example.", "why": "Without notes from digging in, the AI fills the gaps with claims that no source backs up."}]},
{"id": "dig", "chip": "Section C: Step 2, How to Dig", "title": "How to dig into a source", "body": "<p>Reading a source is not the same as digging into it. Digging means you read with a purpose. Before you fill in the Step 2 cards, here is how to dig into each kind of source.</p>\n<h3>Read it twice</h3>\n<p>Read it once for the big idea. Then read it again and pick out what matters: the problem, the numbers, the pros, and the cons. If you only read once, you will remember the headline and miss the details you need.</p>\n<h3>Round One: look for the problem</h3>\n<p>Ask whether the source describes the same problem you have. What words do they use? What do they say causes it? What do they say it costs? If the source talks about a different problem, it is not helping your case, so find a better one.</p>\n<h3>Round Two: dig into the numbers</h3>\n<ul>\n<li><b>Pull out every number, and write what it measures.</b> A bare number is easy to misread.</li>\n<li><b>Rank them.</b> Some numbers decide your case and some are nice to know. The ones tied to your ask and your problem matter most. The rest are background.</li>\n<li><b>Say why.</b> Write one line on why the top numbers matter more than the others.</li>\n<li><b>Compare them to your own numbers.</b> A number only means something next to the situation it has to fix.</li>\n</ul>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani, Round Two</span>\n<p>Dani lists what the BendPak XPR-10AS says, using three pages:</p>\n<ul>\n<li><b>Spec sheet:</b> lift capacity 10,000 lb, time to full rise 45 seconds, maximum lifting height 79 in, and 220V single-phase power. Link: <a href=\"https://global-uploads.webflow.com/5e94d8ed625f9c1df681e6ec/60b907cc14294c56465b6384_XPR-10AS-Two-Post-Lift-5175397-BendPak.pdf\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://global-uploads.webflow.com/5e94d8ed625f9c1df681e6ec/60b907cc14294c56465b6384_XPR-10AS-Two-Post-Lift-5175397-BendPak.pdf</a></li>\n<li><b>Retailer page, for the price (the spec sheet has none):</b> about $5,300. Link: <a href=\"https://reach.dog/shop/asva-products/products/bendpak-xpr-10as-10-000-lb-capacity-asymmetric-2-post-lift\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://reach.dog/shop/asva-products/products/bendpak-xpr-10as-10-000-lb-capacity-asymmetric-2-post-lift</a></li>\n<li><b>BendPak warranty page, for the warranty (the spec sheet has none):</b> 5 years on the structure, 2 years on the hydraulic cylinders and power unit. Link: <a href=\"https://www.bendpak.com/support/faqs/warranty\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://www.bendpak.com/support/faqs/warranty</a></li>\n</ul>\n<p><b>Which numbers matter most, and why:</b></p>\n<p>Price and the power unit warranty matter most. About $5,300 is close to what I am asking Ray to approve. Lift capacity and rise time are the same for both lifts, so they do not decide it. Height and power are background unless our shop floor cannot handle 220V.</p>\n<div class=\"why\">Why it works: Dani did not treat every number the same. Dani picked the ones that decide the case and said why, which gives Ray a reason to care.</div></div>\n<h3>Round Three: dig into the voices</h3>\n<ul>\n<li><b>Look for both pros and cons.</b> For every person, write what worked well and what went wrong. Do not keep only the voices that agree with you. A source with only praise or only complaints is telling you less than it seems.</li>\n<li><b>Ask how their experience is similar to or different from yours.</b> Is their shop the size of yours? Do they do the same work? Their situation tells you how much weight to give what they say.</li>\n<li><b>Do this for both brands.</b> Source 1 is about your Option 1 brand and Source 2 is about your Option 2 brand. If you only look hard at one, your comparison is not fair.</li>\n</ul>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani, Round Three</span>\n<p>Dani reads a review written up from shop owner Thomas Stevens:</p>\n<ul>\n<li><b>Fleet Maintenance,</b> \"BendPak Ranger lift review: BendPak XPR-10S\" Link: <a href=\"https://www.fleetmaintenance.com/in-the-bay/tools/article/21088669/bendpak-ranger-lift-review-bendpak-xpr-10s\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://www.fleetmaintenance.com/in-the-bay/tools/article/21088669/bendpak-ranger-lift-review-bendpak-xpr-10s</a></li>\n</ul>\n<p><b>Pros:</b> He says the install went smoothly and the lift has never let him down in two years of daily use. He rates it 10 out of 10.</p>\n<p><b>Cons:</b> He names no problems, and an all-praise review is a warning sign by itself, because it tells me what he likes and not what could go wrong. The review is about the XPR-10S, not the XPR-10AS, and it is from 2019.</p>\n<p><b>Similar or different:</b> He uses it every day in a working shop, which is close to my situation, but it is a sister model and the review is from 2019. I also do not know how many jobs a day his lift handles, so I cannot tell if his shop is as busy as mine.</p>\n<div class=\"why\">Why it works: Dani wrote down the good and the bad, then checked how the owner's shop compares to Dani's before deciding how much to trust it.</div></div>", "goes": "This is the skill the rest of the week depends on. A source you dug into well is one you can talk about in your meeting. A source you only skimmed is not.", "qs": [{"q": "You read a source for the second time. What are you doing differently than the first read?", "o": ["Picking out the problem, numbers, pros, and cons that matter", "Reading it faster to finish sooner", "Looking for typos in the writing", "Copying it into your notes"], "c": 0, "hint": "See \"Read it twice.\"", "why": "The first read gets the big idea. The second read picks out what matters."}, {"q": "A page lists ten numbers about a product. What should you do with them?", "o": ["Treat every number as equally important", "Skip the numbers and write a summary", "Only write down the first three numbers on the page", "Rank them and say why the top ones matter most for your case"], "c": 3, "hint": "See \"Rank them.\"", "why": "Some numbers decide your case and some are background. Say which and why."}, {"q": "Dani finds a review that only praises a product. What is the best move?", "o": ["Use it, since it supports the ask", "Remove any criticism from the other sources", "Keep looking for voices that also describe what went wrong", "Ask the AI to add the downsides"], "c": 2, "hint": "See \"Look for both pros and cons.\"", "why": "A source with only praise tells you less than it seems. Look for the cons too."}], "write": {"prompt": "Pick one source. Write what problem it describes or which numbers matter most, and how the person's experience is similar to or different from yours.", "min": 0, "use": "Step 2, Dig Into Each Source"}},
{"id": "s2a", "chip": "Section D: Step 2, Part 1", "title": "Read it and say it in your own words", "body": "<p>Step 2 gives each source its own card. You open the link, read the source, and fill in the card. Part 1 is about the first two boxes: <b>what it says</b>, and <b>the key facts</b>.</p>\n<h3>What it says, in your own words</h3>\n<p>Do not copy and paste. Close the page for a moment and explain it like you would to a coworker. If you cannot, read it again. Your own words show you understood it. This is also what the AI will use, so your wording matters.</p>\n<h3>The key facts</h3>\n<p>Pull out the few facts that matter for your case. What you pull depends on the round.</p>\n<ul>\n<li><b>Round One, the problem is recognized:</b> the key points or quotes that show the industry sees the same problem.</li>\n<li><b>Round Two, the numbers:</b> the actual numbers, like price, size or capacity, speed, upkeep, power needs, or warranty, whatever fits your product. Write what each number is, not only the number.</li>\n<li><b>Round Three, real voices:</b> what the person actually said about using this kind of equipment, in their words. Aim Source 1 at real voices about your Option 1 brand and Source 2 at real voices about your Option 2 brand, so you can compare how each one works in real life.</li>\n</ul>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani, Round Two</span>\n<p>Dani opens the BendPak XPR-10AS spec sheet and fills in the card. Link: <a href=\"https://global-uploads.webflow.com/5e94d8ed625f9c1df681e6ec/60b907cc14294c56465b6384_XPR-10AS-Two-Post-Lift-5175397-BendPak.pdf\" target=\"_blank\" rel=\"noopener\" style=\"word-break:break-all\">https://global-uploads.webflow.com/5e94d8ed625f9c1df681e6ec/60b907cc14294c56465b6384_XPR-10AS-Two-Post-Lift-5175397-BendPak.pdf</a></p>\n<p><b>What it says:</b> BendPak lists the XPR-10AS as a 10,000 lb two-post lift. The sheet gives capacity, rise time, heights, and power. It is a sales document, so it gives the product's best case and says nothing about price or warranty.</p>\n<p><b>The numbers:</b> Price about $5,300 (retailer page). Lift capacity 10,000 lb. Time to full rise 45 seconds. Max lifting height 79 in. Power 220 VAC, 60 Hz, single phase. Warranty: 5 years on the structure, 2 years on the hydraulic cylinders and power unit, 1 year on operating parts and labor (BendPak warranty page).</p>\n<p>Then Dani ties the numbers to the ask: This gives me the numbers for a second lift at about the price in my ask.</p>\n<div class=\"why\">Why it works: Dani wrote what each number measures and tied it to the ask. A bare number is easy to misread.</div></div>\n<div class=\"callout\"><b>If a source does not say what you hoped:</b> that is useful. Go find a better one. Do not bend your notes to make a weak source fit.</div>", "goes": "The wording you write here goes straight into your package. Write it as if someone will read it, because the AI will.", "qs": [{"q": "Why do you write what a source says in your own words?", "o": ["It keeps your notes shorter than the original", "It shows you understood the source and gives the AI clear wording", "It lets you avoid citing the source later", "Your instructor does not allow quotes in the notes"], "c": 1, "hint": "Read the \"in your own words\" paragraph.", "why": "Your own words show you understood it. This is also what the AI uses."}, {"q": "In Round Two, what should you write down about a number?", "o": ["What the number is and what it means, not only the number", "Only the number, since it speaks for itself", "The number rounded to the nearest ten", "Nothing, because numbers go in the Methodology only"], "c": 0, "hint": "See the Round Two bullet.", "why": "A bare number is easy to misread, so write what it measures."}, {"q": "In Round Three, what do you pull out?", "o": ["The title of the video or post", "A summary of the whole conversation in your own words only", "How many people liked or viewed it", "What the person actually said about using this kind of equipment"], "c": 3, "hint": "See the Round Three bullet.", "why": "You want what they said about real use, in their words."}], "write": {"prompt": "Pick one source from your Week 2 list. Write what it says in your own words and the key facts you will pull from it.", "min": 0, "use": "Step 2, Dig Into Each Source"}},
{"id": "s2b", "chip": "Section E: Step 2, Part 2", "title": "Who wrote it, what do they gain, why it matters", "body": "<p>The last two boxes on every card are about the person behind the source and what the source does for your case.</p>\n<h3>Who wrote it, and what do they gain or lose?</h3>\n<p>Every source comes from someone. Name them and say what they do in the trade. Then ask what they gain if you believe them. A seller gains a sale. A trade association gains members. A worker who bought the machine may gain from defending the purchase. This does not make a source bad. It tells you how much weight to give it.</p>\n<ul>\n<li>A <b>seller's page</b> is good for specs and price. It cannot be your only source, because the seller wants the sale.</li>\n<li>A <b>trade association</b> is good for what the industry recognizes. Check who the author is.</li>\n<li>A <b>blog or video</b> works when the writer or speaker is named and you can see their role in the trade.</li>\n<li>A page with <b>no named person</b> is weak. You cannot tell who is speaking.</li>\n</ul>\n<h3>Why it matters to your case</h3>\n<p>Tie the source back to your ask. Say what it proves, and which part of your case it supports. If you cannot say, the source may not belong.</p>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani, Round Two</span>\n<p><b>Who wrote it:</b> BendPak, the maker, gains a sale if I believe the page. The sheet has no price or warranty, so I took those from other pages. That means I have to check the price and the warranty against a second source before Ray sees them.</p>\n<p><b>Why it matters:</b> Gives the numbers for a second lift at about the price in my ask. It also gives Ray the warranty he cares about, and I can compare it with the other brand on the same terms.</p>\n<p><b>What Dani flags:</b> BendPak is the seller, so these numbers need a second source behind them, ideally a shop that owns one. The price and warranty also come from other pages, so I need to check those too. That is what Step 3 is for.</p>\n<div class=\"why\">Why it works: Dani named who is speaking and what they gain. Dani also tied each number to the ask, and flagged what the source leaves out instead of treating it as neutral.</div></div>\n<h3>Compare your two options (Round Two)</h3>\n<p>In Round Two you saved two options for the same kind of equipment. Your supervisor should see both, side by side, and then hear which one you think is best and why. Your supervisor makes the call, but your reasons help.</p>\n<ul>\n<li><b>Compare on the same measures.</b> Pick the three measures that matter most for your product, such as speed, capacity, durability, upkeep, or warranty. Use the same measures for both options, along with price. Dani picked lift capacity, time to full rise, and the warranty on the power unit. If one option does not list a number, write \"not listed.\" Do not compare a number to a blank.</li>\n<li><b>Use the numbers, not a feeling.</b> Say which option wins on what, and what it costs you.</li>\n<li><b>Be fair.</b> If the other option wins on something, say so. A fair comparison is harder to argue with.</li>\n</ul>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani, comparing two brands</span>\n<p><b>Option 1, BendPak XPR-10AS:</b> price about $5,300. Lift capacity 10,000 lb. Time to full rise 45 seconds. Warranty on the power unit 2 years.</p>\n<p><b>Option 2, Rotary SPOA10:</b> price about $7,400. Lift capacity 10,000 lb. Time to full rise 45 seconds. Warranty on the power unit 1 year.</p>\n<p><b>Anything else that matters, Option 1:</b> 5-year warranty on the structure</p>\n<p><b>Anything else that matters, Option 2:</b> 5-year warranty on the structure</p>\n<p><b>Which one is best, and why:</b> I recommend Option 1, the BendPak XPR-10AS. Both lifts are rated 10,000 lb and take 45 seconds to full rise, so price and warranty decide it. The BendPak is about $2,000 cheaper and its power unit warranty is a year longer. That fits what Ray cares about most: a lower price he can pay from a good month, and a longer warranty on the part that failed last Tuesday. I will check for service near us first.</p>\n<div class=\"why\">Why it works: Dani compared both options on the same numbers, noticed which numbers were the same and which decided it, gave the other option credit where it wins, tied the pick to the budget in the ask, and said what is still unchecked.</div></div>", "goes": "Who is speaking and what they gain tells the AI, and Ray, how much weight to give each source.", "qs": [{"q": "A source's author gains from you believing it. What does that mean?", "o": ["The source is useless and you should delete it", "You must find an author who gains nothing", "It tells you how much weight to give it", "It only matters for Round One"], "c": 2, "hint": "Read the paragraph under \"Who wrote it.\"", "why": "It does not make a source bad. It tells you how much weight to give it."}, {"q": "Which source is weak because you cannot tell who is speaking?", "o": ["A trade association guide with a named author", "A page with no named person and no sign of the writer's role", "A video by someone who names their role in the trade", "A seller page that lists its specs"], "c": 1, "hint": "See the bullet list.", "why": "A page with no named person is weak."}, {"q": "Dani's Round Two source is the maker's own page. What should Dani do?", "o": ["Use it for specs, and note it needs a second source behind it", "Throw it out, since sellers are not allowed", "Treat it as neutral, since it lists real numbers", "Rewrite its numbers so they sound less like an ad"], "c": 0, "hint": "See the \"Watch it work\" box.", "why": "A seller's page is good, but not alone."}], "write": {"prompt": "Use the same source from Section D. Write who wrote it, what they gain or lose, and why it matters to your case.", "min": 0, "use": "Step 2, Dig Into Each Source"}},
{"id": "s3", "chip": "Section F: Step 3", "title": "Fact-check your key claims", "body": "<p>You already opened and read every source in Step 2. Step 3 asks something different: can you point to the exact spot in a source that backs up each claim? In Step 3 you list the claims your proposal will lean on and show where in your sources each one comes from.</p>\n<h3>Where your claims come from</h3>\n<p>A claim is something your proposal will say that you need to be able to prove. You already wrote your claims down in earlier steps. Look back at:</p>\n<ul>\n<li><b>Your problem and the incident</b> from Step 1. This is your first claim: what happened.</li>\n<li><b>Your framework</b> from Step 1. What does it say?</li>\n<li><b>The key facts boxes</b> on your Step 2 cards. Pick the main numbers for each of your two options.</li>\n<li><b>The pros and cons</b> from your Round Three cards.</li>\n</ul>\n<p>Choose the ones your proposal depends on most. Then, for each one, find the exact spot in your source. Here are the three steps:</p>\n<ol class=\"roadmap\">\n<li><b>List your key claims.</b> Pick at least two. Good picks are the incident, what your framework says, and the main numbers for each of your two options.</li>\n<li><b>Say which source it comes from, and where in it.</b> Name the source, then give the page, section, paragraph, or timestamp, and the exact words or number. If you cannot find the spot, the claim does not belong in your proposal.</li>\n<li><b>Note the date or version.</b> Write the date or version of that source. Research goes stale. A price from years ago or an old rule may no longer be true.</li>\n</ol>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani, Round Two</span>\n<p>Dani lists the claims the proposal will lean on and finds where each one comes from.</p>\n<p><b>Claim 1:</b> Both the BendPak XPR-10AS and the Rotary SPOA10 take 45 seconds to full rise.</p>\n<p><b>Which source it comes from:</b> Round Two, Option 1 (the BendPak spec sheet) and Option 2 (the Rotary SPOA10 cutsheet).</p>\n<p><b>Where in the source:</b> On the BendPak sheet, the line that reads \"Time to Full Rise 45 seconds.\" On the Rotary cutsheet, the line that gives the standard rise time as 45 seconds.</p>\n<p><b>Date or version:</b> The BendPak sheet is for the XPR-10AS, SKU 5175397, and shows no date, so I wrote the SKU. The Rotary cutsheet shows 2023 in its file name, so I wrote that.</p>\n<p><b>Claim 2:</b> A tire industry group tells shops to update the equipment they have before the busy season.</p>\n<p><b>Which source it comes from:</b> Round One, Source 1 (the Autosphere article by Matt White).</p>\n<p><b>Where in the source:</b> The line that reads \"Update the equipment you do have.\"</p>\n<p><b>Date or version:</b> The web address shows May 2026.</p>\n<p><b>Claim 3 (optional):</b> Both lifts carry a 5-year warranty on the structure.</p>\n<p><b>Which source it comes from:</b> BendPak warranty page, and the retailer listing for the Rotary.</p>\n<p><b>Where in the source:</b> BendPak: \"Five Years (60 Months) Warranty on the lift structure.\" Retailer: \"5 Year Warranty on Equipment Structure.\"</p>\n<p><b>Date or version:</b> Neither page shows a date, so I wrote the day I looked: November 13, 2026.</p>\n<div class=\"why\">Why it works: Dani can point to the exact spot for each claim and show Ray the words on the page. There are no surprises later, in the proposal or in the meeting.</div></div>\n<h3>Check both options the same way</h3>\n<p>Give both of your Round Two options the same kind of claims. If you find the exact spot for one option and not the other, your comparison is not fair. Dani pointed to the BendPak spec sheet, so Dani also points to the Rotary cutsheet.</p>\n<h3>When you cannot find the spot</h3>\n<p>Do not guess and do not make it fit. Read the source again. If it does not say it, change the claim to match what the source really says, find a source that does say it, or cut the claim. If a source turns out to be wrong, find a real replacement that does the same job, dig into it, and update your notes.</p>\n<h3>If you use AI to look for a spot</h3>\n<p>AI can help you search, but you must open the page and find the words yourself. A real-looking quote is not proof.</p>", "goes": "If you can point to the exact spot in your source, you can defend the claim. This step is what lets you say \"I checked it\" in your meeting.", "qs": [{"q": "How is Step 3 different from Step 2?", "o": ["It repeats Step 2 for every source", "It replaces your sources with new ones", "It asks the AI to check your sources", "It asks you to point to the exact spot in a source that backs each key claim"], "c": 3, "hint": "See the opening paragraph.", "why": "Step 2 digs into each source. Step 3 ties each claim to an exact spot."}, {"q": "What goes in the \"Where in the source\" box?", "o": ["A link to a new page", "Your own opinion of the source", "The page, section, paragraph, or timestamp, and the exact words or number", "The name of the AI tool you used"], "c": 2, "hint": "See item 2 of the list.", "why": "You show the exact spot so you can point to it in your meeting."}, {"q": "You cannot find where a source says your claim. What do you do?", "o": ["Keep the claim, since it sounds true", "Read the source again, then fix the claim, find a source that says it, or cut it", "Ask the AI to confirm it", "Change the page number so it looks right"], "c": 1, "hint": "See \"When you cannot find the spot.\"", "why": "A claim you cannot point to does not belong in your proposal."}], "write": {"prompt": "Pick one claim you plan to use. Write what it is, which source it comes from, and where in the source it says so.", "min": 0, "use": "Step 3, Fact-Check Your Key Claims"}},
{"id": "s5", "chip": "Section G: Steps 4 and 5", "title": "Build your source list and assemble your package", "body": "<p>Step 4 builds your source list. Step 5 puts it all together into the <b>verified package</b> the AI will use.</p>\n<h3>Step 4, build your source list</h3>\n<p>First, verify your sources one more time. The worksheet lists every source you brought in, with its link. Open each link and check that it goes to the right page and that the title matches. If something is wrong, go back to page 2 and fix it. Then check the box and click the button to build your list from the sources you imported. The AI can format the references later, so what matters now is accuracy.</p>\n<h3>Step 5, assemble your package</h3>\n<p>The package is your ask, your problem, your framework, every source with what you found when you dug in (the numbers that matter, the pros and cons, and how each person's experience compares to yours), your fact-checked key claims, and your side-by-side comparison of your two options. You download the package as a PDF, and your instructor tells you how to use it with the AI.</p>\n<h3>What the AI does and does not do</h3>\n<ul>\n<li><b>It does:</b> write the four sections of your proposal from your package and nothing else.</li>\n<li><b>It does:</b> build a speaking guide from your package, to help you prepare for your meeting with your instructor.</li>\n<li><b>It does not:</b> choose which option is best. It presents both options fairly. You make the pick.</li>\n<li><b>It does not:</b> add sources, facts, or quotes that are not in your package.</li>\n</ul>\n<div class=\"example\"><span class=\"tag\">Watch it work: Dani</span>\n<p>Dani reads the package before using it. One source card still has an empty \"why it matters\" box. Dani fills it in first, because a thin card makes a thin paragraph.</p>\n<div class=\"why\">Why it works: Dani treats the package like the final evidence, because the AI will take it exactly as written.</div></div>", "goes": "The package is everything the AI sees. Read it like your supervisor would before you use it.", "qs": [{"q": "What is in your verified package?", "o": ["Your ask, problem, framework, and every source with what you found when you dug in", "Only your ask and problem", "Only a list of links to your sources", "The AI's draft and your edits"], "c": 0, "hint": "See Step 5.", "why": "The package is your whole verified body of evidence."}, {"q": "Which of these does the AI NOT do?", "o": ["Write the four sections from your package", "Use only the facts in your package", "Follow the prompt your instructor gives you", "Add sources or quotes that are not in your package"], "c": 3, "hint": "See \"What the AI does and does not do.\"", "why": "The AI writes only from your package. It does not add sources, facts, or quotes."}, {"q": "Dani finds an empty \"why it matters\" box in the package. What should Dani do?", "o": ["Send it as it is, since the AI will figure it out", "Delete that source from the list", "Fill it in before sending, because a thin card makes a thin paragraph", "Ask the AI to fill in the box"], "c": 2, "hint": "See the \"Watch it work\" box.", "why": "The AI takes the package exactly as written."}], "write": {"prompt": "Write what you will check in your package before you submit it. Name one card you think is still thin.", "min": 0, "use": "Steps 4 and 5, Source List and Package"}},

var STATE={name:'',cur:0,unlocked:0,q:{},w:{}};
var KEY='tge1150_m4w3_reading_v1';
try{var sv=localStorage.getItem(KEY);if(sv){var o=JSON.parse(sv);if(o&&o.q)STATE=o;}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(STATE));}catch(e){}}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qKey(i,j){return SECTIONS[i].id+'_'+j;}
function wc(t){var m=(t||'').trim().match(/\S+/g);return m?m.length:0;}
function wDone(i){var s=SECTIONS[i];if(!s.write)return true;return (STATE.w[s.id]||'').trim().length>0;}
function secDone(i){var s=SECTIONS[i];if(s.kind==='start')return !!STATE.name.trim();if(s.kind==='finish')return false;
  for(var j=0;j<s.qs.length;j++){var r=STATE.q[qKey(i,j)];if(!r||!r.correct)return false;}
  return wDone(i);}

function renderProgress(){
  var p=document.getElementById('progress');p.innerHTML='';
  SECTIONS.forEach(function(s,i){var d=document.createElement('div');d.className='dot'+(i===STATE.cur?' cur':(i<STATE.unlocked&&secDone(i)?' done':''));p.appendChild(d);});
  document.getElementById('plabel').textContent='Section '+(STATE.cur+1)+' of '+SECTIONS.length+': '+SECTIONS[STATE.cur].title;
}

function render(){
  var s=SECTIONS[STATE.cur],i=STATE.cur,html='';
  renderProgress();
  if(s.kind==='start'){
    html+='<div class="panel"><span class="chip">Week 3</span><h2>Dig in</h2>';
    html+='<p>This is an interactive reading. It explains each part of the Research Proposal Worksheet: how to dig into your sources, check them, and build a verified package. You do the real work on the worksheet. This reading is where you learn what it asks and what a strong answer looks like.</p>';
    html+='<h3>How it works</h3><ul><li>Read each section. Each one follows one example person, Dani, so you can see the idea in action.</li><li>Answer the questions. You have to get every one right to move on. If you miss one, the reading tells you where to look, and you try again.</li><li>Most sections end with short notes for your worksheet. Write them about your own situation. Your instructor reads these.</li><li>At the end you print the reading to a PDF and submit it. The PDF shows your answers and your worksheet notes.</li></ul>';
    html+='<label class="l" for="nm">Your first and last name</label><input type="text" id="nm" value="'+esc(STATE.name)+'" placeholder="First Last" autocomplete="name">';
    html+='</div>';
    html+='<div class="nav"><span class="lockmsg" id="lm"></span><button class="btn" id="nx" disabled onclick="go(1)">Start reading</button></div>';
    document.getElementById('stage').innerHTML=html;
    var nm=document.getElementById('nm');
    function chk(){STATE.name=nm.value;persist();var ok=!!nm.value.trim();document.getElementById('nx').disabled=!ok;document.getElementById('lm').textContent=ok?'':'Enter your name to begin.';}
    nm.addEventListener('input',chk);chk();
    return;
  }
  if(s.kind==='finish'){
    html+='<div class="panel"><span class="chip">Finished</span><h2>Finish and submit</h2><p>You read every section, answered every question correctly, and wrote your responses. Here is what you completed:</p>';
    for(var k=1;k<SECTIONS.length-1;k++){html+='<div class="sumrow"><span>'+esc(SECTIONS[k].title)+'</span><span>Complete</span></div>';}
    html+='<h3>What to do now</h3><ul><li>Click <b>Download PDF</b>. Your print window opens. Choose <b>Save as PDF</b> as the destination.</li><li>Submit that PDF for the Week 3 reading assignment.</li><li>Keep your thinking. When you work on the Research Proposal Worksheet, you will do the real digging, checking, and writing for each step. Your Week 2 sources are your starting point.</li></ul>';
    html+='<div class="row"><button class="btn" onclick="doPrint()">Download PDF</button></div></div>';
    html+='<div class="nav"><button class="btn alt" onclick="go(-1)">Back</button><span></span></div>';
    document.getElementById('stage').innerHTML=html;return;
  }
  html+='<div class="panel"><span class="chip">'+esc(s.chip)+'</span><h2>'+esc(s.title)+'</h2>'+s.body;
  if(s.goes)html+='<div class="goes"><b>Where this goes:</b> '+esc(s.goes)+'</div>';
  html+='<div class="check"><h3>Check what you read</h3><p style="font-size:15px;color:var(--muted)">Answer every question correctly to unlock the next part.</p>';
  s.qs.forEach(function(q,j){
    var st=STATE.q[qKey(i,j)]||{};
    html+='<div class="q" data-j="'+j+'"><div class="qt">'+(j+1)+'. '+esc(q.q)+'</div>';
    q.o.forEach(function(o,k){var cls='opt'+(st.correct&&k===q.c?' right':'');html+='<button class="'+cls+'" data-k="'+k+'"'+(st.correct?' disabled':'')+'>'+esc(o)+'</button>';});
    html+='<div class="fb'+(st.correct?' ok':' hidden')+'" id="fb'+j+'">'+(st.correct?'Correct. '+esc(q.why):'')+'</div></div>';
  });
  html+='</div>';
  if(s.write){html+='<div class="write"><h3>Notes for your worksheet</h3><p style="font-size:15px;color:var(--muted)">Write notes you will use when you fill out the worksheet. Your own situation, not Dani.</p><p style="font-size:15px;font-weight:600;color:var(--navy)">Use these notes in the worksheet: '+esc(s.write.use)+'.</p><p>'+esc(s.write.prompt)+'</p>'+(s.write.items?'<ul>'+s.write.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')+'<textarea id="wr" placeholder="Write your notes here."></textarea></div>';}
  html+='</div>';
  html+='<div class="nav"><button class="btn alt" onclick="go(-1)">Back</button><span class="lockmsg" id="lm"></span><button class="btn" id="nx" onclick="go(1)">'+(i===SECTIONS.length-2?'Finish':'Next section')+'</button></div>';
  document.getElementById('stage').innerHTML=html;
  document.querySelectorAll('.q').forEach(function(qe){
    var j=+qe.getAttribute('data-j');
    qe.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){answer(i,j,+b.getAttribute('data-k'),qe);});});
  });
  if(s.write){var ta=document.getElementById('wr');ta.value=STATE.w[s.id]||'';
    ta.addEventListener('input',function(){STATE.w[s.id]=ta.value;persist();updateNext();});}
  updateNext();
}

function answer(i,j,k,qe){
  var q=SECTIONS[i].qs[j],key=qKey(i,j),st=STATE.q[key]||(STATE.q[key]={attempts:0,correct:false});
  if(st.correct)return;
  st.attempts++;
  var fb=qe.querySelector('.fb'),btns=qe.querySelectorAll('.opt');
  if(k===q.c){
    st.correct=true;
    btns.forEach(function(b){b.disabled=true;if(+b.getAttribute('data-k')===k)b.classList.add('right');b.classList.remove('wrong');});
    fb.className='fb ok';fb.textContent='Correct. '+q.why;
  }else{
    btns.forEach(function(b){b.classList.remove('wrong');if(+b.getAttribute('data-k')===k)b.classList.add('wrong');});
    fb.className='fb no';fb.textContent='Not quite. '+q.hint+' Then try again.';
  }
  persist();updateNext();
}

function updateNext(){
  var i=STATE.cur,s=SECTIONS[i],nx=document.getElementById('nx'),lm=document.getElementById('lm');
  if(!nx||s.kind)return;
  var done=secDone(i),qsDone=true;
  for(var j=0;j<s.qs.length;j++){var r=STATE.q[qKey(i,j)];if(!r||!r.correct)qsDone=false;}
  nx.disabled=!done;
  var msg='';
  if(!qsDone)msg='Answer every question correctly to continue.';
  else if(!wDone(i))msg='Write something in your notes to continue.';
  if(lm)lm.textContent=msg;
  
  if(done&&STATE.unlocked<i+1)STATE.unlocked=i+1;
  renderProgress();
}

function go(d){
  var n=STATE.cur+d;
  if(n<0||n>=SECTIONS.length)return;
  if(d>0&&!secDone(STATE.cur))return;
  STATE.cur=n;if(STATE.unlocked<n)STATE.unlocked=n;
  persist();render();window.scrollTo({top:0,behavior:'smooth'});
}

function buildPrint(){
  var d=new Date().toLocaleDateString();
  var h='<h1>Dig In: Interactive Reading</h1><div class="pv-meta">TGE 1150 · Module 4 · Week 3<br><b>Name:</b> '+esc(STATE.name)+' &nbsp; <b>Date:</b> '+esc(d)+'</div>';
  for(var i=1;i<SECTIONS.length-1;i++){
    var s=SECTIONS[i];h+='<div class="pv-sec"><h4>'+esc(s.chip)+': '+esc(s.title)+'</h4>';
    s.qs.forEach(function(q,j){var st=STATE.q[qKey(i,j)]||{attempts:0};h+='<div class="pv-q">'+(j+1)+'. '+esc(q.q)+'<br><i>Answer: '+esc(q.o[q.c])+' (correct on attempt '+st.attempts+')</i></div>';});
    if(s.write){h+='<div class="pv-q pv-w"><b>Worksheet notes (for the Research Proposal Worksheet, '+esc(s.write.use)+'):</b> '+esc(s.write.prompt)+(s.write.items?'<ul>'+s.write.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')+'</div><div class="pv-r">'+esc(STATE.w[s.id]||'')+'</div>';}
    h+='</div>';
  }
  h+='<div class="pv-attest">I read each section, answered every question, and wrote my responses in my own words. Signed: '+esc(STATE.name)+'</div>';
  document.getElementById('printView').innerHTML=h;
}
function doPrint(){buildPrint();window.print();}
window.addEventListener('beforeprint',buildPrint);
render();
</script>
</body>
</html>
